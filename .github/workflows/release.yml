name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DriverPick-windows
          path: |
            dist/DriverPick-Setup.exe
            dist/DriverPick-Portable.exe
      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # On a tag push the tag is used as-is; a manual dispatch creates (or
      # updates) the release for the version in package.json, so a release
      # can be cut without pushing a tag.
      - name: Create release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          files: |
            dist/DriverPick-Setup.exe
            dist/DriverPick-Portable.exe

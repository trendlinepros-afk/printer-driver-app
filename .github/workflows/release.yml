name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DriverPick-windows
          path: |
            dist/DriverPick-Setup.exe
            dist/DriverPick-Portable.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DriverPick-Setup.exe
            dist/DriverPick-Portable.exe
